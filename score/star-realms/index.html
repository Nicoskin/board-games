<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<title>Звёздные империи — счётчик влияния</title>
<meta name="description" content="Счётчик очков влияния для настольной игры «Звёздные империи»">
<meta name="theme-color" content="#070b1a">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Влияние">
<link rel="icon" href="icons/icon-192.png" type="image/png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<link rel="stylesheet" href="style.css">
</head>
<body>
<div id="stars" aria-hidden="true"></div>

<main id="board"></main>

<nav id="bar">
  <a id="btn-home" class="bar-btn" href="../../#score" aria-label="Все игры" title="Все игры">
    <svg viewBox="0 0 24 24"><path d="M3 11l9-8 9 8"/><path d="M5 10v10h14V10"/><path d="M10 20v-6h4v6"/></svg>
  </a>
  <button id="btn-undo" class="bar-btn" aria-label="Отменить последнее изменение" title="Отменить">
    <svg viewBox="0 0 24 24"><path d="M9 14 4 9l5-5"/><path d="M4 9h10.5a5.5 5.5 0 0 1 0 11H11"/></svg>
  </button>
  <button id="btn-log" class="bar-btn" aria-label="История" title="История">
    <svg viewBox="0 0 24 24"><path d="M3 12a9 9 0 1 0 3-6.7L3 8"/><path d="M3 3v5h5"/><path d="M12 7v5l3 2"/></svg>
  </button>
  <button id="btn-wake" class="bar-btn" aria-label="Экран не гаснет" title="Экран не гаснет">
    <svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>
  </button>
  <button id="btn-new" class="bar-btn" aria-label="Новая игра" title="Новая игра">
    <svg viewBox="0 0 24 24"><path d="M21 12a9 9 0 1 1-3-6.7L21 8"/><path d="M21 3v5h-5"/></svg>
  </button>
  <button id="btn-settings" class="bar-btn" aria-label="Настройки" title="Настройки">
    <svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.7 1.7 0 0 0 .3 1.8l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.7 1.7 0 0 0-1.8-.3 1.7 1.7 0 0 0-1 1.5V21a2 2 0 1 1-4 0v-.1a1.7 1.7 0 0 0-1.1-1.5 1.7 1.7 0 0 0-1.8.3l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1a1.7 1.7 0 0 0 .3-1.8 1.7 1.7 0 0 0-1.5-1H3a2 2 0 1 1 0-4h.1a1.7 1.7 0 0 0 1.5-1.1 1.7 1.7 0 0 0-.3-1.8l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1a1.7 1.7 0 0 0 1.8.3H9a1.7 1.7 0 0 0 1-1.5V3a2 2 0 1 1 4 0v.1a1.7 1.7 0 0 0 1 1.5 1.7 1.7 0 0 0 1.8-.3l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.7 1.7 0 0 0-.3 1.8V9a1.7 1.7 0 0 0 1.5 1H21a2 2 0 1 1 0 4h-.1a1.7 1.7 0 0 0-1.5 1z"/></svg>
  </button>
</nav>

<!-- Настройки -->
<dialog id="dlg-settings">
  <form method="dialog" class="sheet">
    <h2>Настройки</h2>

    <div class="row">
      <span>Игроков</span>
      <div class="seg" id="seg-players">
        <button type="button" data-n="2">2</button>
        <button type="button" data-n="3">3</button>
        <button type="button" data-n="4">4</button>
      </div>
    </div>

    <div class="row">
      <span>Начальное влияние</span>
      <div class="stepper">
        <button type="button" id="start-minus">−</button>
        <output id="start-val"></output>
        <button type="button" id="start-plus">+</button>
      </div>
    </div>

    <div class="row">
      <span>Вид счёта</span>
      <div class="seg wide" id="seg-style">
        <button type="button" data-s="digits">Цифры</button>
        <button type="button" data-s="shield">Щит</button>
        <button type="button" data-s="green">Зелёный</button>
      </div>
    </div>

    <label class="row check">
      <span>Лицом к лицу<small>Верхние игроки перевёрнуты — удобно, когда телефон лежит между вами</small></span>
      <input id="opt-face" type="checkbox">
    </label>

    <label class="row check" id="row-full">
      <span>На весь экран<small>Скрывает строку состояния и кнопки навигации</small></span>
      <input id="opt-full" type="checkbox">
    </label>

    <label class="row check">
      <span>Вибрация при нажатии<small>Работает на Android</small></span>
      <input id="opt-vibe" type="checkbox">
    </label>

    <div class="names" id="names"></div>

    <div class="actions">
      <button type="button" id="settings-apply" class="primary">Начать новую игру</button>
      <button value="close">Закрыть</button>
    </div>
  </form>
</dialog>

<!-- История -->
<dialog id="dlg-log">
  <form method="dialog" class="sheet">
    <h2>История</h2>
    <ol id="log-list"></ol>
    <div class="actions"><button value="close" class="primary">Закрыть</button></div>
  </form>
</dialog>

<!-- Подтверждение новой игры -->
<dialog id="dlg-new">
  <form method="dialog" class="sheet small">
    <h2>Новая игра?</h2>
    <p>Влияние всех игроков вернётся к <b id="new-start"></b>.</p>
    <div class="actions">
      <button value="yes" class="primary">Начать</button>
      <button value="no">Отмена</button>
    </div>
  </form>
</dialog>

<div id="toast" role="status" aria-live="polite"></div>

<script src="app.js"></script>
</body>
</html>
